<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Profil Fotoğrafı Özelleştirici</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 30px;
            padding: 30px;
        }

        .avatar-preview {
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .avatar-container {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        #avatar-svg {
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 100%;
            height: auto;
        }

        .download-btn {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .customization-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .option-group {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .option-group.hidden {
            display: none;
        }

        .option-group h3 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-group h3::before {
            content: '⚽';
            font-size: 1.2em;
        }

        .option-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .option-btn {
            padding: 10px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .option-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .option-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .color-picker-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .color-option {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .color-option label {
            font-size: 0.9em;
            color: #666;
            font-weight: 600;
        }

        input[type="color"] {
            width: 60px;
            height: 60px;
            border: 3px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        input[type="color"]:hover {
            border-color: #667eea;
            transform: scale(1.1);
        }

        .pattern-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .pattern-btn {
            aspect-ratio: 1;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 0.85em;
        }

        .pattern-btn:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .pattern-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pattern-preview {
            width: 40px;
            height: 40px;
            border-radius: 5px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .avatar-preview {
                position: relative;
                top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Futbol Profil Fotoğrafı Oluşturucu</h1>
            <p>Kendi futbolcu avatarını özelleştir ve indir</p>
        </div>

        <div class="main-content">
            <div class="avatar-preview">
                <div class="avatar-container">
                    <svg id="avatar-svg" width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Gradient definitions for better quality -->
                            <radialGradient id="faceGradient" cx="50%" cy="40%" r="50%">
                                <stop offset="0%" style="stop-color:#FFE4C4;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FFD9B3;stop-opacity:1" />
                            </radialGradient>

                            <linearGradient id="jerseyShading" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
                                <stop offset="50%" style="stop-color:#000000;stop-opacity:0" />
                                <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
                            </linearGradient>

                            <!-- Jersey patterns -->
                            <pattern id="stripe-pattern-vertical" x="0" y="0" width="30" height="100%" patternUnits="userSpaceOnUse">
                                <rect width="15" height="100%" fill="#FF0000"/>
                                <rect x="15" width="15" height="100%" fill="#0000FF"/>
                            </pattern>
                            <pattern id="stripe-pattern-horizontal" x="0" y="0" width="100%" height="30" patternUnits="userSpaceOnUse">
                                <rect width="100%" height="15" fill="#FF0000"/>
                                <rect y="15" width="100%" height="15" fill="#0000FF"/>
                            </pattern>

                            <!-- Shadow filters -->
                            <filter id="shadow">
                                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                            </filter>
                        </defs>

                        <!-- Background -->
                        <rect id="bg-rect" width="500" height="500" fill="#87CEEB"/>

                        <!-- Jersey Body (football uniform style) -->
                        <g id="jersey-group">
                            <!-- Main jersey body - more athletic shape -->
                            <path id="jersey-path" d="M 130 280 L 110 310 L 110 450 L 180 450 L 180 390 L 220 390 L 220 500 L 380 500 L 380 390 L 320 390 L 320 450 L 390 450 L 390 310 L 370 280 L 350 280 L 350 340 L 330 350 L 320 310 L 280 290 L 220 290 L 180 310 L 170 350 L 150 340 L 150 280 Z" fill="#FF0000"/>

                            <!-- Jersey shading overlay -->
                            <path d="M 130 280 L 110 310 L 110 450 L 180 450 L 180 390 L 220 390 L 220 500 L 380 500 L 380 390 L 320 390 L 320 450 L 390 450 L 390 310 L 370 280 L 350 280 L 350 340 L 330 350 L 320 310 L 280 290 L 220 290 L 180 310 L 170 350 L 150 340 L 150 280 Z" fill="url(#jerseyShading)" opacity="0.5"/>

                            <!-- Collar V-neck -->
                            <path d="M 230 295 L 250 330 L 270 295 Z" fill="#FFF" opacity="0.6"/>

                            <!-- Jersey number -->
                            <text id="jersey-number" x="250" y="380" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#FFFFFF" text-anchor="middle" stroke="#000" stroke-width="2">10</text>
                        </g>

                        <!-- Neck -->
                        <ellipse id="neck" cx="250" cy="280" rx="22" ry="18" fill="url(#faceGradient)"/>

                        <!-- Head -->
                        <ellipse id="head" cx="250" cy="200" rx="65" ry="75" fill="url(#faceGradient)" filter="url(#shadow)"/>

                        <!-- Ears with shadow -->
                        <ellipse id="ear-left" cx="185" cy="200" rx="10" ry="15" fill="#FFD9B3"/>
                        <ellipse cx="186" cy="200" rx="5" ry="8" fill="#FFB380"/>
                        <ellipse id="ear-right" cx="315" cy="200" rx="10" ry="15" fill="#FFD9B3"/>
                        <ellipse cx="314" cy="200" rx="5" ry="8" fill="#FFB380"/>

                        <!-- Hair group -->
                        <g id="hair-group"></g>

                        <!-- Face features -->
                        <!-- Eyebrows -->
                        <g id="eyebrows-group">
                            <path d="M 215 185 Q 225 182, 235 185" stroke="#6B4423" stroke-width="3" fill="none" stroke-linecap="round"/>
                            <path d="M 265 185 Q 275 182, 285 185" stroke="#6B4423" stroke-width="3" fill="none" stroke-linecap="round"/>
                        </g>

                        <!-- Eyes with more detail -->
                        <g id="eyes-group">
                            <!-- Left eye -->
                            <ellipse cx="225" cy="200" rx="12" ry="16" fill="white"/>
                            <circle cx="225" cy="202" r="8" fill="#6B4423"/>
                            <circle cx="225" cy="202" r="5" fill="#000000"/>
                            <circle cx="227" cy="200" r="2" fill="white"/>

                            <!-- Right eye -->
                            <ellipse cx="275" cy="200" rx="12" ry="16" fill="white"/>
                            <circle cx="275" cy="202" r="8" fill="#6B4423"/>
                            <circle cx="275" cy="202" r="5" fill="#000000"/>
                            <circle cx="277" cy="200" r="2" fill="white"/>
                        </g>

                        <!-- Eyelashes (hidden by default, shown for female) -->
                        <g id="eyelashes-group" style="display: none;">
                            <!-- Left eye lashes -->
                            <path d="M 213 192 Q 210 188, 212 192" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <path d="M 220 189 Q 220 185, 220 189" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <path d="M 230 189 Q 230 185, 230 189" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <path d="M 237 192 Q 240 188, 238 192" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>

                            <!-- Right eye lashes -->
                            <path d="M 263 192 Q 260 188, 262 192" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <path d="M 270 189 Q 270 185, 270 189" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <path d="M 280 189 Q 280 185, 280 189" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <path d="M 287 192 Q 290 188, 288 192" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </g>

                        <!-- Glasses (hidden by default) -->
                        <g id="glasses-group" style="display: none;"></g>

                        <!-- Nose with shading -->
                        <path id="nose" d="M 250 210 L 245 225 L 255 225 Z" fill="#FFB380"/>
                        <ellipse cx="246" cy="226" rx="3" ry="2" fill="#E39A6D" opacity="0.6"/>
                        <ellipse cx="254" cy="226" rx="3" ry="2" fill="#E39A6D" opacity="0.6"/>

                        <!-- Mouth with better detail -->
                        <path id="mouth" d="M 230 245 Q 250 255, 270 245" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
                        <path id="mouth-inner" d="M 235 247 Q 250 252, 265 247" fill="#C76868" stroke="none"/>

                        <!-- Cheek blush -->
                        <ellipse cx="205" cy="215" rx="12" ry="8" fill="#FFB6C1" opacity="0.3"/>
                        <ellipse cx="295" cy="215" rx="12" ry="8" fill="#FFB6C1" opacity="0.3"/>

                        <!-- Beard (hidden by default) -->
                        <g id="beard-group" style="display: none;"></g>
                    </svg>
                    <button class="download-btn" onclick="downloadAvatar()">📥 Profil Fotoğrafını İndir (HD)</button>
                </div>
            </div>

            <div class="customization-panel">
                <!-- Gender -->
                <div class="option-group">
                    <h3>Cinsiyet</h3>
                    <div class="option-buttons">
                        <button class="option-btn active" onclick="setGender('male')">👨 Erkek</button>
                        <button class="option-btn" onclick="setGender('female')">👩 Kadın</button>
                    </div>
                </div>

                <!-- Hair Style -->
                <div class="option-group">
                    <h3>Saç Modeli</h3>
                    <div class="option-buttons">
                        <button class="option-btn active" onclick="setHairStyle('short')">Kısa</button>
                        <button class="option-btn" onclick="setHairStyle('long')">Uzun</button>
                        <button class="option-btn" onclick="setHairStyle('curly')">Kıvırcık</button>
                        <button class="option-btn" onclick="setHairStyle('bald')">Kel</button>
                        <button class="option-btn" onclick="setHairStyle('ponytail')">Topuz</button>
                    </div>
                </div>

                <!-- Hair Color -->
                <div class="option-group">
                    <h3>Saç Rengi</h3>
                    <div class="color-picker-group">
                        <div class="color-option">
                            <label>Renk Seç</label>
                            <input type="color" id="hair-color" value="#4A2511" onchange="setHairColor(this.value)">
                        </div>
                        <div class="option-buttons">
                            <button class="option-btn" onclick="setHairColor('#000000')">Siyah</button>
                            <button class="option-btn active" onclick="setHairColor('#4A2511')">Kahve</button>
                            <button class="option-btn" onclick="setHairColor('#F4A460')">Sarı</button>
                            <button class="option-btn" onclick="setHairColor('#FF0000')">Kırmızı</button>
                        </div>
                    </div>
                </div>

                <!-- Beard (will be hidden for female) -->
                <div class="option-group" id="beard-option-group">
                    <h3>Sakal</h3>
                    <div class="option-buttons">
                        <button class="option-btn active" onclick="setBeard('none')">Yok</button>
                        <button class="option-btn" onclick="setBeard('light')">Hafif</button>
                        <button class="option-btn" onclick="setBeard('full')">Dolgun</button>
                        <button class="option-btn" onclick="setBeard('goatee')">Keçi Sakalı</button>
                    </div>
                </div>

                <!-- Glasses -->
                <div class="option-group">
                    <h3>Gözlük</h3>
                    <div class="option-buttons">
                        <button class="option-btn active" onclick="setGlasses('none')">Yok</button>
                        <button class="option-btn" onclick="setGlasses('regular')">Normal</button>
                        <button class="option-btn" onclick="setGlasses('round')">Yuvarlak</button>
                        <button class="option-btn" onclick="setGlasses('sunglasses')">Güneş</button>
                    </div>
                </div>

                <!-- Jersey Pattern -->
                <div class="option-group">
                    <h3>Forma Deseni</h3>
                    <div class="pattern-options">
                        <button class="pattern-btn active" onclick="setJerseyPattern('solid')">
                            <div class="pattern-preview" style="background: #FF0000;"></div>
                            Düz
                        </button>
                        <button class="pattern-btn" onclick="setJerseyPattern('vertical')">
                            <div class="pattern-preview" style="background: repeating-linear-gradient(90deg, #FF0000 0px, #FF0000 5px, #0000FF 5px, #0000FF 10px);"></div>
                            Dikey
                        </button>
                        <button class="pattern-btn" onclick="setJerseyPattern('horizontal')">
                            <div class="pattern-preview" style="background: repeating-linear-gradient(0deg, #FF0000 0px, #FF0000 5px, #0000FF 5px, #0000FF 10px);"></div>
                            Yatay
                        </button>
                    </div>
                </div>

                <!-- Jersey Colors -->
                <div class="option-group">
                    <h3>Forma Renkleri</h3>
                    <div class="color-picker-group">
                        <div class="color-option">
                            <label>Ana Renk</label>
                            <input type="color" id="jersey-color1" value="#FF0000" onchange="setJerseyColor1(this.value)">
                        </div>
                        <div class="color-option">
                            <label>İkinci Renk</label>
                            <input type="color" id="jersey-color2" value="#0000FF" onchange="setJerseyColor2(this.value)">
                        </div>
                    </div>
                    <div class="option-buttons" style="margin-top: 10px;">
                        <button class="option-btn" onclick="setJerseyPreset('#FF0000', '#FFFF00')">🔴🟡 Kırmızı-Sarı</button>
                        <button class="option-btn" onclick="setJerseyPreset('#0000FF', '#FFFF00')">🔵🟡 Mavi-Sarı</button>
                        <button class="option-btn" onclick="setJerseyPreset('#000000', '#FFFFFF')">⚫⚪ Siyah-Beyaz</button>
                        <button class="option-btn" onclick="setJerseyPreset('#00FF00', '#FFFFFF')">🟢⚪ Yeşil-Beyaz</button>
                    </div>
                </div>

                <!-- Background Color -->
                <div class="option-group">
                    <h3>Arka Plan Rengi</h3>
                    <div class="color-picker-group">
                        <div class="color-option">
                            <label>Renk Seç</label>
                            <input type="color" id="bg-color" value="#87CEEB" onchange="setBackgroundColor(this.value)">
                        </div>
                        <div class="option-buttons">
                            <button class="option-btn" onclick="setBackgroundColor('#87CEEB')">Mavi</button>
                            <button class="option-btn" onclick="setBackgroundColor('#90EE90')">Yeşil</button>
                            <button class="option-btn" onclick="setBackgroundColor('#FFB6C1')">Pembe</button>
                            <button class="option-btn" onclick="setBackgroundColor('#DDA0DD')">Mor</button>
                            <button class="option-btn" onclick="setBackgroundColor('#F0F0F0')">Gri</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration object to store current avatar settings
        const avatarConfig = {
            gender: 'male',
            hairStyle: 'short',
            hairColor: '#4A2511',
            beard: 'none',
            glasses: 'none',
            jerseyPattern: 'solid',
            jerseyColor1: '#FF0000',
            jerseyColor2: '#0000FF',
            backgroundColor: '#87CEEB'
        };

        // Gender
        function setGender(gender) {
            avatarConfig.gender = gender;
            setActiveButton(event.target);
            updateGender();
            updateBeardVisibility();
        }

        function updateGender() {
            const head = document.getElementById('head');
            const nose = document.getElementById('nose');
            const mouth = document.getElementById('mouth');
            const mouthInner = document.getElementById('mouth-inner');
            const eyelashes = document.getElementById('eyelashes-group');
            const neck = document.getElementById('neck');

            if (avatarConfig.gender === 'female') {
                // Kadın için daha küçük ve yumuşak hatlar
                head.setAttribute('rx', '62');
                head.setAttribute('ry', '73');
                nose.setAttribute('d', 'M 250 215 L 247 222 L 253 222 Z');
                mouth.setAttribute('d', 'M 235 245 Q 250 252, 265 245');
                mouthInner.setAttribute('d', 'M 238 247 Q 250 251, 262 247');
                eyelashes.style.display = 'block';
                neck.setAttribute('rx', '20');
                neck.setAttribute('ry', '16');
            } else {
                // Erkek için daha büyük ve belirgin hatlar
                head.setAttribute('rx', '65');
                head.setAttribute('ry', '75');
                nose.setAttribute('d', 'M 250 210 L 245 225 L 255 225 Z');
                mouth.setAttribute('d', 'M 230 245 Q 250 255, 270 245');
                mouthInner.setAttribute('d', 'M 235 247 Q 250 252, 265 247');
                eyelashes.style.display = 'none';
                neck.setAttribute('rx', '22');
                neck.setAttribute('ry', '18');
            }
        }

        function updateBeardVisibility() {
            const beardGroup = document.getElementById('beard-option-group');
            if (avatarConfig.gender === 'female') {
                beardGroup.classList.add('hidden');
                // Kadın seçildiğinde sakalı otomatik kaldır
                if (avatarConfig.beard !== 'none') {
                    avatarConfig.beard = 'none';
                    updateBeard();
                }
            } else {
                beardGroup.classList.remove('hidden');
            }
        }

        // Hair Style
        function setHairStyle(style) {
            avatarConfig.hairStyle = style;
            setActiveButton(event.target);
            updateHair();
        }

        function updateHair() {
            const hairGroup = document.getElementById('hair-group');
            const color = avatarConfig.hairColor;
            const style = avatarConfig.hairStyle;

            // Create darker shade for hair depth
            const darkerColor = shadeColor(color, -20);

            let hairSVG = '';

            switch(style) {
                case 'short':
                    // Kısa saç - daha detaylı
                    hairSVG = `
                        <path d="M 185 175 Q 185 125, 250 120 Q 315 125, 315 175 L 315 195 Q 310 140, 250 135 Q 190 140, 185 195 Z" fill="${color}"/>
                        <path d="M 185 175 Q 185 130, 250 125 Q 315 130, 315 175" fill="${darkerColor}" opacity="0.3"/>
                        <!-- Hair texture lines -->
                        <path d="M 200 150 Q 210 145, 220 150" stroke="${darkerColor}" stroke-width="2" fill="none" opacity="0.4"/>
                        <path d="M 240 140 Q 250 135, 260 140" stroke="${darkerColor}" stroke-width="2" fill="none" opacity="0.4"/>
                        <path d="M 280 150 Q 290 145, 300 150" stroke="${darkerColor}" stroke-width="2" fill="none" opacity="0.4"/>
                    `;
                    break;
                case 'long':
                    // Uzun saç - daha detaylı ve akıcı
                    hairSVG = `
                        <path d="M 185 175 Q 185 125, 250 120 Q 315 125, 315 175 L 315 200 Q 310 145, 250 140 Q 190 145, 185 200 Z" fill="${color}"/>
                        <path d="M 185 200 Q 180 240, 175 280 L 165 280 Q 170 235, 183 200 Z" fill="${color}"/>
                        <path d="M 315 200 Q 320 240, 325 280 L 335 280 Q 330 235, 317 200 Z" fill="${color}"/>
                        <!-- Hair highlights -->
                        <path d="M 180 220 Q 175 240, 172 260" stroke="${darkerColor}" stroke-width="3" fill="none" opacity="0.3"/>
                        <path d="M 320 220 Q 325 240, 328 260" stroke="${darkerColor}" stroke-width="3" fill="none" opacity="0.3"/>
                        <ellipse cx="250" cy="140" rx="40" ry="15" fill="${darkerColor}" opacity="0.2"/>
                    `;
                    break;
                case 'curly':
                    // Kıvırcık saç - daha hacimli
                    hairSVG = `
                        <ellipse cx="200" cy="145" rx="24" ry="26" fill="${color}"/>
                        <ellipse cx="230" cy="135" rx="26" ry="28" fill="${color}"/>
                        <ellipse cx="250" cy="130" rx="28" ry="30" fill="${color}"/>
                        <ellipse cx="270" cy="135" rx="26" ry="28" fill="${color}"/>
                        <ellipse cx="300" cy="145" rx="24" ry="26" fill="${color}"/>
                        <ellipse cx="190" cy="170" rx="20" ry="22" fill="${color}"/>
                        <ellipse cx="310" cy="170" rx="20" ry="22" fill="${color}"/>
                        <!-- Curl highlights -->
                        <ellipse cx="250" cy="130" rx="15" ry="18" fill="${darkerColor}" opacity="0.3"/>
                        <ellipse cx="230" cy="135" rx="13" ry="15" fill="${darkerColor}" opacity="0.3"/>
                        <ellipse cx="270" cy="135" rx="13" ry="15" fill="${darkerColor}" opacity="0.3"/>
                    `;
                    break;
                case 'bald':
                    // Kel - sadece kafanın parlaklığını artır
                    hairSVG = `
                        <ellipse cx="250" cy="155" rx="50" ry="30" fill="#FFF" opacity="0.1"/>
                    `;
                    break;
                case 'ponytail':
                    // Topuz - daha belirgin
                    hairSVG = `
                        <path d="M 185 175 Q 185 125, 250 122 Q 315 125, 315 175 L 315 195 Q 310 142, 250 137 Q 190 142, 185 195 Z" fill="${color}"/>
                        <ellipse cx="250" cy="120" rx="32" ry="38" fill="${color}"/>
                        <ellipse cx="250" cy="105" rx="24" ry="26" fill="${color}"/>
                        <!-- Ponytail tie -->
                        <ellipse cx="250" cy="125" rx="8" ry="6" fill="#333"/>
                        <!-- Highlights -->
                        <ellipse cx="250" cy="110" rx="12" ry="15" fill="${darkerColor}" opacity="0.3"/>
                    `;
                    break;
            }

            hairGroup.innerHTML = hairSVG;
        }

        // Helper function to darken/lighten color
        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16);
            let G = parseInt(color.substring(3,5),16);
            let B = parseInt(color.substring(5,7),16);

            R = parseInt(R * (100 + percent) / 100);
            G = parseInt(G * (100 + percent) / 100);
            B = parseInt(B * (100 + percent) / 100);

            R = (R<255)?R:255;
            G = (G<255)?G:255;
            B = (B<255)?B:255;

            R = Math.round(R);
            G = Math.round(G);
            B = Math.round(B);

            let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
            let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
            let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));

            return "#"+RR+GG+BB;
        }

        // Hair Color
        function setHairColor(color) {
            avatarConfig.hairColor = color;
            document.getElementById('hair-color').value = color;
            if(event && event.target.classList.contains('option-btn')) {
                setActiveButton(event.target);
            }
            updateHair();
            updateBeard();
        }

        // Beard
        function setBeard(type) {
            avatarConfig.beard = type;
            setActiveButton(event.target);
            updateBeard();
        }

        function updateBeard() {
            const beardGroup = document.getElementById('beard-group');
            const color = avatarConfig.hairColor;
            const type = avatarConfig.beard;
            const darkerColor = shadeColor(color, -20);

            if(type === 'none') {
                beardGroup.style.display = 'none';
            } else {
                beardGroup.style.display = 'block';
                let beardSVG = '';

                switch(type) {
                    case 'light':
                        // Hafif sakal - çene etrafında daha detaylı
                        beardSVG = `
                            <path d="M 210 235 Q 210 252, 218 260 Q 230 267, 250 267 Q 270 267, 282 260 Q 290 252, 290 235"
                                  fill="${color}" opacity="0.5" stroke="${color}" stroke-width="1"/>
                            <path d="M 215 240 L 220 245 M 230 248 L 235 253 M 265 253 L 270 248 M 280 245 L 285 240"
                                  stroke="${darkerColor}" stroke-width="1.5" opacity="0.4"/>
                        `;
                        break;
                    case 'full':
                        // Dolgun sakal - daha hacimli ve detaylı
                        beardSVG = `
                            <ellipse cx="250" cy="245" rx="55" ry="35" fill="${color}"/>
                            <path d="M 195 220 Q 190 238, 195 250 L 200 245 Q 198 232, 200 220 Z" fill="${color}"/>
                            <path d="M 305 220 Q 310 238, 305 250 L 300 245 Q 302 232, 300 220 Z" fill="${color}"/>
                            <!-- Beard texture -->
                            <ellipse cx="250" cy="245" rx="45" ry="28" fill="${darkerColor}" opacity="0.2"/>
                            <path d="M 220 245 Q 230 250, 240 245" stroke="${darkerColor}" stroke-width="2" fill="none" opacity="0.3"/>
                            <path d="M 260 245 Q 270 250, 280 245" stroke="${darkerColor}" stroke-width="2" fill="none" opacity="0.3"/>
                        `;
                        break;
                    case 'goatee':
                        // Keçi sakalı - daha tanımlı
                        beardSVG = `
                            <ellipse cx="250" cy="252" rx="28" ry="25" fill="${color}"/>
                            <path d="M 228 235 Q 228 242, 233 248 Q 240 252, 250 252 Q 260 252, 267 248 Q 272 242, 272 235"
                                  fill="${color}" stroke="${color}" stroke-width="1"/>
                            <!-- Goatee definition -->
                            <ellipse cx="250" cy="252" rx="20" ry="18" fill="${darkerColor}" opacity="0.2"/>
                            <path d="M 240 248 Q 250 250, 260 248" stroke="${darkerColor}" stroke-width="1.5" fill="none" opacity="0.4"/>
                        `;
                        break;
                }

                beardGroup.innerHTML = beardSVG;
            }
        }

        // Glasses
        function setGlasses(type) {
            avatarConfig.glasses = type;
            setActiveButton(event.target);
            updateGlasses();
        }

        function updateGlasses() {
            const glassesGroup = document.getElementById('glasses-group');
            const type = avatarConfig.glasses;

            if(type === 'none') {
                glassesGroup.style.display = 'none';
            } else {
                glassesGroup.style.display = 'block';
                let glassesSVG = '';

                switch(type) {
                    case 'regular':
                        glassesSVG = `
                            <rect x="203" y="192" width="38" height="26" fill="rgba(255,255,255,0.1)" stroke="#333" stroke-width="3" rx="4"/>
                            <rect x="259" y="192" width="38" height="26" fill="rgba(255,255,255,0.1)" stroke="#333" stroke-width="3" rx="4"/>
                            <line x1="241" y1="205" x2="259" y2="205" stroke="#333" stroke-width="3"/>
                            <line x1="203" y1="205" x2="190" y2="203" stroke="#333" stroke-width="2.5"/>
                            <line x1="297" y1="205" x2="310" y2="203" stroke="#333" stroke-width="2.5"/>
                            <!-- Glass reflection -->
                            <path d="M 207 195 L 235 200" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
                            <path d="M 263 195 L 291 200" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
                        `;
                        break;
                    case 'round':
                        glassesSVG = `
                            <circle cx="225" cy="205" r="18" fill="rgba(255,255,255,0.1)" stroke="#333" stroke-width="3"/>
                            <circle cx="275" cy="205" r="18" fill="rgba(255,255,255,0.1)" stroke="#333" stroke-width="3"/>
                            <line x1="243" y1="205" x2="257" y2="205" stroke="#333" stroke-width="3"/>
                            <line x1="207" y1="205" x2="194" y2="203" stroke="#333" stroke-width="2.5"/>
                            <line x1="293" y1="205" x2="306" y2="203" stroke="#333" stroke-width="2.5"/>
                            <!-- Glass reflection -->
                            <path d="M 215 195 Q 220 193, 225 195" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                            <path d="M 265 195 Q 270 193, 275 195" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                        `;
                        break;
                    case 'sunglasses':
                        glassesSVG = `
                            <rect x="203" y="192" width="38" height="26" fill="#1a1a1a" stroke="#000" stroke-width="3" rx="4" opacity="0.95"/>
                            <rect x="259" y="192" width="38" height="26" fill="#1a1a1a" stroke="#000" stroke-width="3" rx="4" opacity="0.95"/>
                            <line x1="241" y1="205" x2="259" y2="205" stroke="#000" stroke-width="3"/>
                            <line x1="203" y1="205" x2="190" y2="203" stroke="#000" stroke-width="2.5"/>
                            <line x1="297" y1="205" x2="310" y2="203" stroke="#000" stroke-width="2.5"/>
                            <!-- Sunglasses reflection -->
                            <path d="M 207 195 L 235 202" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round"/>
                            <path d="M 263 195 L 291 202" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round"/>
                            <ellipse cx="215" cy="200" rx="6" ry="4" fill="rgba(255,255,255,0.2)"/>
                            <ellipse cx="265" cy="200" rx="6" ry="4" fill="rgba(255,255,255,0.2)"/>
                        `;
                        break;
                }

                glassesGroup.innerHTML = glassesSVG;
            }
        }

        // Jersey Pattern
        function setJerseyPattern(pattern) {
            avatarConfig.jerseyPattern = pattern;
            setActiveButton(event.target);
            updateJersey();
        }

        // Jersey Colors
        function setJerseyColor1(color) {
            avatarConfig.jerseyColor1 = color;
            updateJersey();
        }

        function setJerseyColor2(color) {
            avatarConfig.jerseyColor2 = color;
            updateJersey();
        }

        function setJerseyPreset(color1, color2) {
            avatarConfig.jerseyColor1 = color1;
            avatarConfig.jerseyColor2 = color2;
            document.getElementById('jersey-color1').value = color1;
            document.getElementById('jersey-color2').value = color2;
            setActiveButton(event.target);
            updateJersey();
        }

        function updateJersey() {
            const jerseyPath = document.getElementById('jersey-path');
            const pattern = avatarConfig.jerseyPattern;
            const color1 = avatarConfig.jerseyColor1;
            const color2 = avatarConfig.jerseyColor2;

            // Update pattern definitions
            const verticalPattern = document.querySelector('#stripe-pattern-vertical rect:first-child');
            const verticalPattern2 = document.querySelector('#stripe-pattern-vertical rect:last-child');
            const horizontalPattern = document.querySelector('#stripe-pattern-horizontal rect:first-child');
            const horizontalPattern2 = document.querySelector('#stripe-pattern-horizontal rect:last-child');

            verticalPattern.setAttribute('fill', color1);
            verticalPattern2.setAttribute('fill', color2);
            horizontalPattern.setAttribute('fill', color1);
            horizontalPattern2.setAttribute('fill', color2);

            switch(pattern) {
                case 'solid':
                    jerseyPath.setAttribute('fill', color1);
                    break;
                case 'vertical':
                    jerseyPath.setAttribute('fill', 'url(#stripe-pattern-vertical)');
                    break;
                case 'horizontal':
                    jerseyPath.setAttribute('fill', 'url(#stripe-pattern-horizontal)');
                    break;
            }
        }

        // Background Color
        function setBackgroundColor(color) {
            avatarConfig.backgroundColor = color;
            document.getElementById('bg-color').value = color;
            document.getElementById('bg-rect').setAttribute('fill', color);
            if(event && event.target.classList.contains('option-btn')) {
                setActiveButton(event.target);
            }
        }

        // Helper function to set active button
        function setActiveButton(button) {
            if(!button) return;
            const siblings = button.parentElement.querySelectorAll('.option-btn, .pattern-btn');
            siblings.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }

        // Update entire avatar
        function updateAvatar() {
            updateGender();
            updateBeardVisibility();
            updateHair();
            updateBeard();
            updateGlasses();
            updateJersey();
        }

        // Download avatar as PNG in high quality
        function downloadAvatar() {
            const svg = document.getElementById('avatar-svg');
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            // Higher resolution for better quality
            canvas.width = 1000;
            canvas.height = 1000;

            img.onload = function() {
                ctx.drawImage(img, 0, 0, 1000, 1000);
                const pngFile = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.download = 'futbol-profil-fotografi-hd.png';
                downloadLink.href = pngFile;
                downloadLink.click();
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
        }

        // Initialize avatar on page load
        window.onload = function() {
            updateAvatar();
        };
    </script>
</body>
